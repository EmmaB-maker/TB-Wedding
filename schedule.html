  <style>
    /* Map styles */
    .map-wrapper {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
      background: #f9f5ee;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #e7ddd0;
    }
    
    .map-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }
    
    /* MARKERS - Transparent with colored outline + star */
    .map-marker {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: all 0.3s ease;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      border: 3px solid;
      z-index: 10;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    
    .map-marker:hover {
      transform: translate(-50%, -50%) scale(1.3);
      z-index: 20;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      background: rgba(255, 255, 255, 0.3);
    }
    
    .map-marker .tooltip {
      display: none;
      position: absolute;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      white-space: nowrap;
      font-size: 0.9rem;
      font-weight: normal;
      pointer-events: none;
    }
    
    .map-marker:hover .tooltip {
      display: block;
    }
    
    .map-marker .label {
      font-size: 16px;
      font-weight: bold;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
    
    /* Different colors for different locations - outline + star */
    .marker-ceremony { 
      border-color: #c0392b; 
      color: #c0392b;
    }
    .marker-reception { 
      border-color: #8B4513; 
      color: #8B4513;
    }
    .marker-campground { 
      border-color: #27ae60; 
      color: #27ae60;
    }
    .marker-cabins { 
      border-color: #2980b9; 
      color: #2980b9;
    }
    .marker-parking { 
      border-color: #f39c12; 
      color: #f39c12;
    }
    .marker-trails { 
      border-color: #8e44ad; 
      color: #8e44ad;
    }
    
    /* Pulsing animation - just the glow */
    .marker-ceremony {
      animation: pulse-ceremony 2s infinite;
    }
    
    @keyframes pulse-ceremony {
      0% { box-shadow: 0 0 0 0 rgba(192, 57, 43, 0.5); }
      70% { box-shadow: 0 0 0 15px rgba(192, 57, 43, 0); }
      100% { box-shadow: 0 0 0 0 rgba(192, 57, 43, 0); }
    }
    
    /* Location info panel */
    #locationInfo {
      display: none;
      margin-top: 20px;
      padding: 25px 30px;
      background: #e4ded2;
      border-radius: 16px;
      border-left: 6px solid #b28b6f;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
    
    #locationInfo h3 {
      margin-top: 0;
      color: #3a4f34;
      font-size: 1.8rem;
    }
    
    #locationInfo .close-btn {
      margin-top: 15px;
      padding: 8px 25px;
      background: #7b8f6a;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    
    #locationInfo .close-btn:hover {
      background: #5f7350;
    }
    
    .map-description {
      text-align: center;
      margin-top: 15px;
      color: #5d6e4a;
      font-style: italic;
    }
    
    .map-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      padding: 15px;
      background: #fcf8f0;
      border-radius: 12px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }
    
    .legend-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 3px solid;
      background: rgba(255, 255, 255, 0.2);
    }
    
    .legend-dot.ceremony { border-color: #c0392b; }
    .legend-dot.reception { border-color: #8B4513; }
    .legend-dot.campground { border-color: #27ae60; }
    .legend-dot.cabins { border-color: #2980b9; }
    .legend-dot.parking { border-color: #f39c12; }
    .legend-dot.trails { border-color: #8e44ad; }
    
    /* Map section spacing */
    .map-section {
      margin-top: 3rem;
    }
    
    .map-section h2 {
      margin-bottom: 1rem;
    }
    
    @media (max-width: 600px) {
      .map-marker {
        width: 32px;
        height: 32px;
        font-size: 12px;
        border-width: 2px;
      }
      .map-marker .label {
        font-size: 12px;
      }
      .map-marker .tooltip {
        font-size: 0.7rem;
        padding: 4px 10px;
        bottom: 38px;
      }
      #locationInfo {
        padding: 15px;
      }
      #locationInfo h3 {
        font-size: 1.3rem;
      }
    }
  </style>
