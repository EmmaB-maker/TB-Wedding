<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Map - Green Oaks Farm</title>
  <link rel="stylesheet" href="home.css">
  <style>
    .map-wrapper {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
      background: #f9f5ee;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #e7ddd0;
    }
    
    .map-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }
    
    /* MARKERS - These will show on top of the image */
    .map-marker {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: all 0.3s ease;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border: 3px solid white;
      z-index: 10;
    }
    
    .map-marker:hover {
      transform: translate(-50%, -50%) scale(1.3);
      z-index: 20;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    
    .map-marker .tooltip {
      display: none;
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      white-space: nowrap;
      font-size: 0.9rem;
      font-weight: normal;
      pointer-events: none;
    }
    
    .map-marker:hover .tooltip {
      display: block;
    }
    
    .map-marker .label {
      font-size: 12px;
      font-weight: bold;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    
    /* Different colors for different locations */
    .marker-ceremony { background: #c0392b; }
    .marker-reception { background: #8B4513; }
    .marker-campground { background: #27ae60; }
    .marker-cabins { background: #2980b9; }
    .marker-parking { background: #f39c12; }
    .marker-trails { background: #8e44ad; }
    
    /* Pulsing animation for attention */
    .marker-ceremony {
      animation: pulse-ceremony 2s infinite;
    }
    
    @keyframes pulse-ceremony {
      0% { box-shadow: 0 0 0 0 rgba(192, 57, 43, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(192, 57, 43, 0); }
      100% { box-shadow: 0 0 0 0 rgba(192, 57, 43, 0); }
    }
    
    /* Location info panel */
    #locationInfo {
      display: none;
      margin-top: 20px;
      padding: 25px 30px;
      background: #e4ded2;
      border-radius: 16px;
      border-left: 6px solid #b28b6f;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
    
    #locationInfo h3 {
      margin-top: 0;
      color: #3a4f34;
      font-size: 1.8rem;
    }
    
    #locationInfo .close-btn {
      margin-top: 15px;
      padding: 8px 25px;
      background: #7b8f6a;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    
    #locationInfo .close-btn:hover {
      background: #5f7350;
    }
    
    .map-description {
      text-align: center;
      margin-top: 15px;
      color: #5d6e4a;
      font-style: italic;
    }
    
    .map-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      padding: 15px;
      background: #fcf8f0;
      border-radius: 12px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }
    
    .legend-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #ddd;
    }
    
    @media (max-width: 600px) {
      .map-marker {
        width: 28px;
        height: 28px;
        font-size: 12px;
      }
      .map-marker .tooltip {
        font-size: 0.7rem;
        padding: 4px 10px;
        bottom: 35px;
      }
      #locationInfo {
        padding: 15px;
      }
      #locationInfo h3 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  
  <nav>
    <a href="index.html">Home</a>
    <a href="schedule.html">Details</a>
    <a href="rsvp.html">RSVP</a>
    <a href="map.html" class="active">Map</a>
  </nav>

  <section>
    <h2>Green Oaks Farm Map</h2>
    <p style="text-align: center; margin-bottom: 1.5rem;">📍 Click on any marker to learn more about that location!</p>

    <div class="map-wrapper">
      <!-- YOUR MAP IMAGE -->
      <img src="Profile.PNG" alt="Green Oaks Farm Map" width="900" height="600">
      
      <!-- ============================================================ -->
      <!-- MARKERS - Position these using left% and top%                  -->
      <!-- Each marker shows on top of your image                        -->
      <!-- ============================================================ -->
      
      <!-- Eye -->
      <div class="map-marker marker-ceremony" 
           style="left: 50%; top: 33%;" 
           onclick="showLocation('Emmas Eye', 'Her eyes are a hazel with sunlight but technically just brown.', 'Found on her face')">
        <span class="label">✦</span>
        <span class="tooltip">Eye</span>
      </div>
      
      <!-- Shirt -->
      <div class="map-marker marker-reception" 
           style="left: 60%; top: 70%;" 
           onclick="showLocation('Emmas Shirt', 'A pretty green she likes to wear to conferences.', 'found in her closet 24/7')">
        <span class="label">✦</span>
        <span class="tooltip">Shirt</span>
      </div>
      
      <!-- Leaf -->
      <div class="map-marker marker-campground" 
           style="left: 22%; top: 70%;" 
           onclick="showLocation('Leaf', 'There are many in the background.', 'Available in san francisco')">
        <span class="label">✦</span>
        <span class="tooltip">Leaf</span>
      </div>
      
      <!-- ============================================================ -->
      <!-- END OF MARKERS                                                -->
      <!-- ============================================================ -->
      
    </div>
    
    <!-- Location Info Display -->
    <div id="locationInfo">
      <h3 id="locationName"></h3>
      <p id="locationDescription" style="font-size: 1.1rem;"></p>
      <p id="locationTime" style="font-style: italic; color: #5d6e4a;"></p>
      <button class="close-btn" onclick="closeLocationInfo()">Close</button>
    </div>

    <!-- Legend -->
    <div class="map-legend">
      <div class="legend-item">
        <span class="legend-dot" style="background: #c0392b;"></span>
        Eye
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background: #8B4513;"></span>
        Shirt
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background: #27ae60;"></span>
        Leaf
      </div>
    </div>
    
    <div class="map-description">
      💡 Hover over markers to see names, click for more details
    </div>
  </section>

  <div class="footer-note">
    <span>🌾 Torey & Brian</span>
    <span>·</span>
    <span>June 25–27, 2027</span>
    <span>·</span>
    <span>Green Oaks Farm · Pescadero</span>
  </div>

</div>

<script>
  function showLocation(name, description, time) {
    const infoDiv = document.getElementById('locationInfo');
    document.getElementById('locationName').textContent = '📍 ' + name;
    document.getElementById('locationDescription').textContent = description;
    document.getElementById('locationTime').textContent = time ? '🕐 ' + time : '';
    
    infoDiv.style.display = 'block';
    
    // Smooth scroll to the info box
    setTimeout(() => {
      infoDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
  }
  
  function closeLocationInfo() {
    document.getElementById('locationInfo').style.display = 'none';
  }
</script>

</body>
</html>
